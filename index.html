<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMLMusic Player</title>
    <script src="js/soundfont-player.js"></script>
    <script src="js/PlaybackEngine.js"></script>
    <script src="js/PlaybackScheduler.js"></script>
    <script src="js/StepQueue.js"></script>
    <script src="js/opensheetmusicdisplay.min.js"></script> <!-- you need to provide the .js file, see README.md-->
    <script src="js/fileSelectAndLoadOSMD.js"></script>
    <link rel="stylesheet" href="css/style.css">
 </head>
<body>
    <div id="fileloader">

        <div id="url-loader" style="margin-top:12px;">
            <input id="xmlUrlInput" type="text" placeholder="Lagu 0065.xml" value="Lagu 0065.xml" style="width:260px;margin-bottom:6px;display:block;" />
            <input id="audioUrlInput" type="text" placeholder="Lagu 0065.mp3" value="Lagu 0065.mp3" style="width:260px;margin-bottom:8px;display:block;" />
            <button id="loadUrlButton" style="display:inline-block;padding:6px 12px;">Load from URL</button>
        </div>

    </div>

    <div id="audio-container" style="display: none;">
        <audio id="audioPlayer" preload="metadata"></audio>
        <div class="audio-player-controls">
            <button id="audioPlayPause" class="audio-btn" type="button">▶</button>
            <div id="audioProgressBar" class="audio-progress" aria-label="Audio progress">
                <div id="audioProgress" class="audio-progress-fill"></div>
            </div>
            <span id="audioTime" class="audio-time">00:00 / 00:00</span>
            <button id="audioMute" class="audio-btn" type="button">🔊</button>
            <input id="audioVolume" class="audio-volume" type="range" min="0" max="1" step="0.05" value="1" />
        </div>
    </div>

    <div id="container">
        <div id="sidebar">

            <div id="instruments">

            </div>

        </div>
        <div id="osmdCanvas"></div>
    </div>

    
    
</body>
<script>
    document.onclick = function() {
    }
    window.onload = function() {
        if (typeof initAudioPlayerUI === "function") {
            initAudioPlayerUI();
        }
        document.getElementById("loadUrlButton").addEventListener("click", function () {
            let xmlUrl = document.getElementById("xmlUrlInput").value.trim();
            let audioUrl = document.getElementById("audioUrlInput").value.trim();
            loadMusicFromUrl(xmlUrl, audioUrl);
        }, false);
    }
</script>
</html>
